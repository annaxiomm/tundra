<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="styles/main.css" rel="stylesheet" />
        <link href="styles/window.css" rel="stylesheet" />
        <link href="styles/statusbar.css" rel="stylesheet" />
        <link href="styles/apps.css" rel="stylesheet" />
        <title>tundra</title>
    </head>
    <body>
        <div id="screen">
            <div id="desktop"></div>
            <div id="statusbar">
                <div id="status-left">
                    <div id="appdrawer-container" class="statusbar-item">
                        <div id="appdrawer-button" class="statusbar-button">tundra v0.1.2</div>
                        <div id="appdrawer">
                            <div id="app-about" class="appdrawer-app">
                                <div class="appdrawer-icon">?</div>
                                <div class="appdrawer-label">About Tundra</div>
                            </div>
                            <div id="app-changelog" class="appdrawer-app">
                                <div class="appdrawer-icon">!</div>
                                <div class="appdrawer-label">Changelog</div>
                            </div>
                            <div class="appdrawer-popout-container">
                                <div class="appdrawer-icon">U</div>
                                <div class="appdrawer-label">Utilities</div>
                                <div class="appdrawer-popout up">
                                    <div id="app-browser" class="appdrawer-app">
                                        <div class="appdrawer-icon">w</div>
                                        <div class="appdrawer-label">Browser</div>
                                    </div>
                                    <div id="app-colours" class="appdrawer-app">
                                        <div class="appdrawer-icon">*</div>
                                        <div class="appdrawer-label">Colour Picker</div>
                                    </div>
                                    <div id="app-calculator" class="appdrawer-app">
                                        <div class="appdrawer-icon">+</div>
                                        <div class="appdrawer-label">Calculator</div>
                                    </div>
                                    <div id="app-files" class="appdrawer-app">
                                        <div class="appdrawer-icon">/</div>
                                        <div class="appdrawer-label">File Explorer</div>
                                    </div>
                                </div>
                            </div>
                            <div class="appdrawer-popout-container">
                                <div class="appdrawer-icon">&lt;</div>
                                <div class="appdrawer-label">Development</div>
                                <div class="appdrawer-popout">
                                    <div id="app-terminal" class="appdrawer-app">
                                        <div class="appdrawer-icon">&gt;_</div>
                                        <div class="appdrawer-label">Terminal</div>
                                    </div>
                                </div>
                            </div>
                            <div class="appdrawer-popout-container">
                                <div class="appdrawer-icon">:0</div>
                                <div class="appdrawer-label">Graphics</div>
                                <div class="appdrawer-popout">
                                    <div id="app-cube" class="appdrawer-app">
                                        <div class="appdrawer-icon">[]</div>
                                        <div class="appdrawer-label">Cube</div>
                                    </div>
                                </div>
                            </div>
                            <div id="app-exit" class="appdrawer-app">
                                <div class="appdrawer-icon">:(</div>
                                <div class="appdrawer-label">Exit..</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="status-middle">
                    <div id="window-list" class="statusbar-item"></div>
                </div>
                <div id="status-right">
                    <div id="status-time" class="statusbar-item"></div>
                </div>
            </div>
        </div>
        <h1 id="power-off">shutting down</h1>
        <h1 id="safe">It's now safe to close<br/>the browser tab</h1>
        <script src="main.js" type="module"></script>
    </body>
</html>
