<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="styles/main.css" rel="stylesheet" />
        <link href="styles/window.css" rel="stylesheet" />
        <link href="styles/statusbar.css" rel="stylesheet" />
        <link href="styles/apps.css" rel="stylesheet" />
        <title>tundra</title>
    </head>
    <body>
        <div id="screen">
            <div id="desktop"></div>
            <div id="statusbar">
                <div id="status-left">
                    <div id="appdrawer-container" class="statusbar-item">
                        <div id="appdrawer-button">tundraOS v0.1.0 (alpha)</div>
                        <div id="appdrawer">
                            <ul>
                                <li id="app-welcome">welcome</li>
                                <li id="app-notes">notes</li>
                                <li id="app-image">random image</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div id="status-middle">
                    <div id="window-list" class="statusbar-item"></div>
                </div>
                <div id="status-right">
                    <div id="status_time" class="statusbar-item"></div>
                </div>
            </div>
        </div>
        <script src="main.js" type="module"></script>
    </body>
</html>
